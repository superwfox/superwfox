    <g transform="translate(35 119)"><rect width="150" height="122" rx="12" fill="none" stroke="#8b949e" stroke-width="2"/><text x="75" y="54" font-size="25" font-weight="700" fill="#8b949e">INTENT</text><text x="75" y="86" font-size="17" font-weight="700" fill="#8b949e">REQUIREMENT</text></g>
