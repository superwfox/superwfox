<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">TTDM telemetry review pipeline</title><desc id="desc">Two recorders send encrypted telemetry into the TTDM review interface</desc>
  <g fill="none" stroke="#8b949e" stroke-width="3"><path d="M256 120L390 176"/><path d="M256 280L390 224"/><path d="M610 200H708"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
